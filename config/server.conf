# Atlas is a bounded in-memory service. It does not persist data.
# Listen only on loopback by default. No TLS/authentication is implemented.
address=127.0.0.1
port=7777
io_threads=4
compute_threads=2
max_connections=4096
max_frame_bytes=65536
max_send_bytes=262144
max_send_messages=64
max_inflight_per_session=16
max_inflight_global=4096
# Includes running jobs and pending jobs.
compute_queue=256
memory_budget_bytes=268435456
store_bytes=67108864
store_entries=100000
connect_timeout_ms=5000
read_timeout_ms=10000
idle_timeout_ms=30000
write_timeout_ms=5000
business_timeout_ms=2000
downstream_timeout_ms=1000
shutdown_timeout_ms=5000
metrics_interval_ms=1000
# Empty: metrics remain available through protocol STATS.
metrics_file=
log_level=info
log_queue=4096
